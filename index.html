<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2c2037">
  <title>pusheen blast</title>
  <link rel="icon" href="components/pusheen_idle.gif">
  <link rel="stylesheet" href="style.css?v=dealer7">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <symbol id="sound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
      <symbol id="quiet" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6m0-6-5 6"/></symbol>
      <symbol id="trophy" viewBox="0 0 24 24"><path d="M7 4h10v5q0 6-5 6T7 9zM7 6H3v2q0 4 5 4m9-6h4v2q0 4-5 4m-4 3v4m-4 1h8"/></symbol>
    </defs>
  </svg>
  <div class="picnic" aria-hidden="true"><div class="paw-trail"></div><div class="sparkle-trail"></div></div>
  <main aria-label="Pusheen Block Blast">
    <div class="game-layout">
      <section class="board-card panel" aria-label="Game board">
        <div class="board-stage">
          <div id="grid" role="group" aria-label="Game board"></div>
          <div id="clear-effects" aria-hidden="true"></div>
        </div>
        <div id="combo-banner" role="status" aria-live="polite"></div>
      </section>
      <section class="tray-card panel" aria-label="Piece tray">
        <div id="tray"></div>
      </section>
      <aside class="side">
        <section class="nook panel" aria-label="Pusheen">
          <div class="scene" aria-hidden="true">
            <div class="scene-stars"></div><div class="crescent"></div>
            <div class="cloud cloud-far"></div><div class="cloud cloud-near"></div>
            <img id="mascot" data-mood="idle" src="components/pusheen_idle.gif" alt="">
          </div>
        </section>
        <section class="score-card panel" aria-labelledby="score-title">
          <h2 id="score-title"><svg class="icon"><use href="#trophy"/></svg>Scoreboard</h2>
          <div class="stat"><span>Current score</span><strong id="score">0</strong></div>
          <div class="stat best"><span>Personal best</span><strong id="best-score">0</strong></div>
        </section>
      </aside>
    </div>
  </main>
  <div class="sound-control">
    <button id="sound-btn" aria-label="Sound settings" title="Sound settings" aria-expanded="false" aria-controls="audio-panel"><svg class="icon"><use href="#sound"/></svg></button>
    <div id="audio-panel" hidden>
      <div class="volume-caption"><label for="volume">Volume</label><output for="volume" id="volume-value"></output></div>
      <input type="range" id="volume" min="0" max="100" value="45">
    </div>
  </div>
  <canvas id="confetti" aria-hidden="true" hidden></canvas>
  <audio id="bg-audio" src="components/bg_music.mp3" preload="none" loop></audio>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-inner">
    <div class="loss-scene"><img src="components/pusheen_sad.png" alt="Sad Pusheen"></div>
    <h2 id="dialog-title">No more moves</h2>
    <dl class="results">
      <div><dt>Final score</dt><dd id="final-score"></dd></div>
      <div><dt>Personal best</dt><dd id="final-best"></dd></div>
    </dl>
    <div id="dialog-actions"><button id="replay" class="primary">Play again</button></div>
  </div></dialog>
  <script src="dealer.js?v=dealer7"></script><script src="game.js?v=dealer7"></script>
</body>
</html>
